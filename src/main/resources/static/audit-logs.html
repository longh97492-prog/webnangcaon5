<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tra cứu nhật ký hệ thống</title>
    <link rel="stylesheet" href="/audit-logs.css">
</head>
<body>
<main>
    <h1>Tra cứu nhật ký hệ thống</h1>
    <p>Tra cứu người thực hiện, hành động, đối tượng và thời điểm.</p>

    <section>
        <form id="loginForm">
            <label>
                Tài khoản
                <input id="loginUsername"
                       autocomplete="username" required>
            </label>

            <label>
                Mật khẩu
                <input id="loginPassword" type="password"
                       autocomplete="current-password" required>
            </label>

            <button type="submit">Đăng nhập</button>
        </form>

        <p id="accountStatus">Chưa đăng nhập tại trang này.</p>
        <button id="logoutButton" type="button">Đăng xuất</button>
    </section>

    <section>
        <h2>Bộ lọc nhật ký</h2>

        <form id="filterForm">
            <label>
                Người thực hiện
                <input id="username" placeholder="Ví dụ b07_test">
            </label>

            <label>
                Hành động
                <select id="action">
                    <option value="">Tất cả</option>
                    <option value="LOGIN_SUCCESS">Đăng nhập thành công</option>
                    <option value="ROLE_CHANGE">Đổi vai trò</option>
                    <option value="DELETE_PRODUCT">Xóa sản phẩm</option>
                </select>
            </label>

            <label>
                Từ thời điểm
                <input id="fromTime" type="datetime-local" step="1">
            </label>

            <label>
                Đến thời điểm
                <input id="toTime" type="datetime-local" step="1">
            </label>

            <label>
                Số dòng mỗi trang
                <select id="size">
                    <option value="2">2</option>
                    <option value="5">5</option>
                    <option value="20" selected>20</option>
                    <option value="100">100</option>
                </select>
            </label>

            <button type="submit">Tra cứu</button>
            <button id="resetButton" type="button">Xóa bộ lọc</button>
        </form>

        <p>Thời gian theo giờ lưu trong ứng dụng, gồm cả hai mốc biên.</p>
    </section>

    <section>
        <p id="message" role="status" aria-live="polite"></p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Người thực hiện</th>
                    <th>Hành động</th>
                    <th>Đối tượng</th>
                    <th>Thời điểm</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>

        <div class="controls">
            <button id="previousButton" type="button" disabled>
                Trang trước
            </button>
            <span id="pageInfo">Chưa tải dữ liệu</span>
            <button id="nextButton" type="button" disabled>
                Trang sau
            </button>
        </div>
    </section>
</main>

    <script src="/audit-logs.js" defer></script>
</body>
</html>
